; PSX2PSP-Reborn patch database (built-in).
;
; This file is compiled into the program, on top of popfe.ini (pop-fe's POPS configs, LibCrypt
; words and PPF fixes for ~2000 product codes, generated by tools/popfe_import.py): a [game] here
; wins over pop-fe's for the same ID, field by field for config, libcrypt, pops_id and min_level. Your own entries go
; in the user file, which has the
; same format and is merged on top: a [patch] with the same name for an overlapping game ID, or
; a [game] with an overlapping ID, replaces the built-in one. The app shows where the user file
; lives (portable mode: a patches.ini next to the executable wins).
;
; Syntax
;   ; or # at the start of a line   comment
;   key = value                     a field of the section above it
;   indented line                   continues the previous value (joined with one space)
;
; [game ID ID…]       per-game data. IDs are product codes; case and separators are ignored
;                     (SLES-02895, SLES_028.95, sles02895 are the same).
;   title             shown in the GUI and the log
;   config            POPS emulator config, hex bytes (at most 992). Written into the PSISOIMG
;                     header like Sony's own PS1 Classics. A <image>.pspconfig file next to the
;                     disc still wins over it.
;   source            where the config comes from
;   default           the switches that start on for this game: any of fix, fps, 60hz (default:
;                     fix). List fps and 60hz only once verified on hardware.
;   libcrypt          LibCrypt magic word (decimal or 0x hex, 16 bits): the EBOOT carries the
;                     subchannel table POPS answers the protection from (PSISOIMG 0x12D4/0x12D8)
;   pops_id           the product code to build the disc as (and to look its data up under)
;   min_level         lowest deflate level (1-9) the game loads at on a real PSP: a lower level
;                     chosen in the GUI or CLI is raised to it, and the log says so
;   note              free text
;
; [patch ID ID…]      a patch over the disc; [patch *] = every game. A byte pattern over the data
;                     sectors (search/replace), or a PPF file over the raw image (ppf).
;   name              unique per game: it identifies the patch in the GUI, the CLI and overrides
;   kind              fix   on with the "Game fixes" switch (recommended, default on)
;                     fps   on with the "Unlock fps" switch
;                     60hz  on with the "60 Hz" switch (the game draws its own NTSC picture: the
;                           POPS config is left as it is, no pop-fe force_ntsc bit)
;                     other off unless selected one by one
;   default           on | off (default on): off keeps the patch out of its switch until it is
;                     selected one by one
;   search, replace   hex bytes of equal length, ?? = any byte (in replace: keep the original).
;                     Matched inside one sector's 2048 user bytes; EDC/ECC are regenerated.
;   align             1, 2 or 4 (default 4: MIPS instructions are word aligned)
;   ppf               instead of search/replace: the bytes of a PPF 1/2/3 file, hex. Applied to the
;                     raw image before every other patch (after them only the user's own PPF)
;   md5               limits the patch to these dumps: MD5s of track 1's raw sectors (INDEX 01 to
;                     the next track), as `psx2psp info` prints it
;   note              shown as the patch's explanation in the GUI
;
; A patch that matches nothing on a disc (another build of the game), is for another dump (md5)
; or whose PPF validation block does not match the image is skipped and logged.

; ─────────────────────────── Sheep, Dog 'n' Wolf / Sheep Raider ───────────────────────────

[game SLES-02895 SLUS-01369]
title = Sheep, Dog 'n' Wolf / Sheep Raider
source = pop-fe (The_Ho)
note = pop-fe pspconfigs/Looney Tunes - Sheep Raider/SLES-02895.bin (identical for SLUS-01369),
    by The_Ho (GBAtemp "POPS on PSP/Vita config research"), described by pop-fe PR #267 as fixing
    the game's performance issues. It differs from pop-fe's empty config only at 0x0B-0x0F and
    0x34 (each mirrored at +0x84). SHA-256 3c1619fa...472fdb. All patches below are on by
    default: config, clamp, frame cap and 60 Hz together run on a real PSP (2026-11-12) at 60 Hz
    with no slow motion; the frame rate reaches 60 fps in a few places and drops below it in
    most of the game, which is bound by the emulated CPU.
    Our change: 0x58 (mirror 0xDC) = 5, POPS config word 19, the CPU cycle shift. POPS (all
    pops_0Xg.prx of firmware 6.61) charges each recompiled block (instructions >> shift) cycles
    plus its stall costs; without word 19 the shift is bit 1 of word 0, here 1. The shift
    truncates per block, so at 5 any block under 32 instructions costs only its stalls: the
    instruction term is spent. On a real PSP (2026-11-13) shift 3 removed the slow motion, 5 kept
    the audio clean, and 16 gained nothing visible while possibly slowing down in places. Sony's
    own per-game table inside POPS sets word 19 to 5 for 19 games.
default = fix fps 60hz
config =
    70 00 07 06 00 00 06 06 00 00 00 02 06 00 00 00
    ff ff ff ff ff ff ff ff ff ff ff ff ff ff ff ff
    ff ff ff ff ff ff ff ff ff ff ff ff ff ff ff ff
    ff ff ff ff 18 00 00 00 ff ff ff ff ff ff ff ff
    ff ff ff ff ff ff ff ff ff ff ff ff 00 00 00 00
    ff ff ff ff ff ff ff ff 05 00 00 00 ff ff 00 00
    ff ff ff ff ff ff ff ff 00 00 00 00 00 00 00 00
    ff ff ff ff ff ff ff ff ff ff ff ff ff ff ff ff
    00 00 00 00 00 00 00 00 ff ff ff ff 00 00 00 02
    06 00 00 00 ff ff ff ff ff ff ff ff ff ff ff ff
    ff ff ff ff ff ff ff ff ff ff ff ff ff ff ff ff
    ff ff ff ff ff ff ff ff 18 00 00 00 ff ff ff ff
    ff ff ff ff ff ff ff ff ff ff ff ff ff ff ff ff
    00 00 00 00 ff ff ff ff ff ff ff ff 05 00 00 00
    ff ff 00 00 ff ff ff ff ff ff ff ff 00 00 00 00
    00 00 00 00 ff ff ff ff ff ff ff ff ff ff ff ff
    ff ff ff ff 00 00 00 00 00 00 00 00 ff ff ff ff

; The code patches below are verified on the PAL disc only (every hit audited: 23 of the 26
; executables, never in data, levels or video).
; Every executable is loaded by an Infogrames loader (SLES_028.95, LOADER.EXE, CREDITS.EXE) that
; checks two CRC words in its PS-X EXE header: +0x100 over the first 0x100 header bytes, +0x104
; over the body (CRC-32 0xEDB88320, init 0xFFFFFFFF, no final XOR). Three failures reset the
; console, which is the freeze at a third of the loading bar. Patching any executable without
; updating them hangs the game; the converter recomputes both words for each patched executable
; whose original words match this scheme.

[patch SLES-02895]
name = Physics step clamp 41.5 -> 62.3 ms
kind = fix
search = AB 00 81 28 03 00 20 14 00 00 00 00 AA 00 04 24
replace = 00 01 81 28 ?? ?? ?? ?? ?? ?? ?? ?? FF 00 04 24
note = Removes the random slow motion in game. The game
    times its physics with root counter 1 in hblank mode and clamps each step to 41.5 ms, barely
    more than one 25 fps frame: a frame that takes three vblanks (60 ms) under POPS advances the
    world by only 41.5 ms, so the game runs at 69% speed. The clamp becomes 0xFF = 62.3 ms, which
    covers a three-vblank frame. Verified on a real PSP. Code (LEV00.EXE 0x800361E4): slti at,a0,0xAB /
    bnez at,+3 / nop / addiu a0,zero,0xAA, once in LEV00-17, FEND, INTRO, SCENE, WHEEL, ENDING.

[patch SLES-02895]
name = Frame cap VSync(2) -> VSync(0)
kind = fps
search = ?? ?? ?? 0C 02 00 04 24 03 00 00 10 00 00 00 00 ?? ?? ?? 0C 21 20 00 00
replace = ?? ?? ?? ?? 00 ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ??
note = Lets the game render up to 50/60 fps instead of 25/30. The main loop ends each frame with
    VSync(2) unless it is in a state that already uses VSync(0); physics follow the measured
    frame time, so game speed is unchanged. Code (LEV00.EXE 0x80010754): jal VSync / addiu
    a0,zero,2 / b +3 / nop / jal VSync / move a0,zero, once in the same 23 executables.

[patch SLES-02895]
name = Video standard PAL -> NTSC (boot flags)
kind = 60hz
search = 01 00 08 24 FE FF 04 24 01 00 05 24 10 00 03 24
replace = ?? ?? ?? ?? ?? ?? ?? ?? 00 ?? ?? ?? ?? ?? ?? ??
note = Runs the whole game on its own NTSC path, the one the US release uses: 60 Hz, 240 lines,
    picture centred by the game itself. The disc is one dual-standard build: the boot executable
    (SLES_028.95, 0x80100010) stores the video standard in a flags byte that every level reads
    back. The generic PAL->NTSC patterns do not match this game: their Y fix alone would only
    shift a 50 Hz picture.

[patch SLES-02895]
name = Adaptive VSync (a late frame does not wait)
kind = fps
search =
    01 00 02 24 3A 00 82 10 00 00 00 00 07 00 80 18 00 00 00 00 ?? ?? 02 3C ?? ?? 42 8C
    00 00 00 00 FF FF 42 24 ?? ?? ?? 08 21 10 44 00 ?? ?? 02 3C ?? ?? 42 8C 02 00 80 18
    21 28 00 00 FF FF 85 24 ?? ?? ?? 0C 21 20 40 00 ?? ?? 02 3C ?? ?? 42 8C 00 00 00 00
    ?? ?? 50 8C ?? ?? 04 3C ?? ?? 84 8C 01 00 05 24 ?? ?? ?? 0C 01 00 84 24
replace =
    ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? 00 00 00 00 ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ??
    01 00 83 2C 21 10 43 00 ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ??
    01 00 05 24 21 28 80 00 ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ??
    ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? 00 00 00 00 ?? ?? ?? ??
note = Turns the 30 fps lock of heavy scenes into the rate the emulated PS1 can actually reach:
    on a real PSP (2026-11-14) hub 30 -> 32, gameplay 30 -> 36-41, light scenes still 60, FMV and
    audio clean. VSync(0) always waits for the next
    vblank, so a frame that takes 1.5 vblanks is shown for two (30 fps). After the patch VSync(n)
    waits until n vblanks have passed since the previous call (at least 1): a frame on time still
    waits for its vblank, a late one goes on at once. Back-to-back calls (delays, fades) behave as
    before; emulated timing is untouched. Code: PsyQ libetc VSync (LEV00.EXE 0x80091F70), target
    last+n with a timeout budget of n instead of last+n-1 then the next vblank. Once in each of
    the 26 executables.

; ─────────────────────────── MediEvil ───────────────────────────

[game SCES-00311 SCES-01492 SCES-01493 SCES-01494 SCES-01495 SCUS-94227 SCPS-10081]
title = MediEvil
min_level = 5
note = Built at deflate level 1, MediEvil SCES-01494 hangs on a real PSP (ARK-5) after the last
    intro FMV; the same disc, art and LibCrypt table at level 5 reach
    gameplay (A/B builds, 2026-11-14). Both EBOOTs inflate to the same disc with zlib: the PSP
    kernel inflate that ARK hands POPS blocks to is what fails. Only SCES-01494 is proven; the
    other releases share the engine and data layout, and level 5 costs nothing on the PSP. The
    POPS config and LibCrypt words still come from pop-fe.
