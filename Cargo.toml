[workspace]
resolver = "3"
members = [
    "crates/psx2psp-core",
    "crates/psx2psp-patching",
    "crates/psx2psp-media",
    "crates/psx2psp-engine",
    "crates/psx2psp-app",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
# Workspace-internal crates: shipped as binaries, never published to crates.io.
publish = false

[workspace.dependencies]
psx2psp-core = { path = "crates/psx2psp-core" }
psx2psp-patching = { path = "crates/psx2psp-patching" }
psx2psp-media = { path = "crates/psx2psp-media" }
psx2psp-engine = { path = "crates/psx2psp-engine" }

thiserror = "2.0"
# Exact pin: these deflate streams are what the PSP kernel inflates, and every EBOOT proven on
# hardware came from this version. A bump must pass psar::tests::deflate_streams_are_pinned,
# which only changes after a re-test on a real PSP. Used directly, so no feature unification
# elsewhere in the graph (flate2's zlib-rs backend, say) can switch the encoder silently.
miniz_oxide = "=0.9.1"
rayon = "1.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
bytemuck = { version = "1.25", features = ["derive"] }
tempfile = "3.27"

[profile.dev.package."*"]
# Dependencies (iced, wgpu, image, deflate) optimised even in debug: keeps the UI at 60 FPS while iterating.
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
