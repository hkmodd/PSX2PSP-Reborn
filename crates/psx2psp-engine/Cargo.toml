[package]
name = "psx2psp-engine"
description = "Application layer: ConvertIsoToPbp / ExtractPbp / InspectPbp use cases + the `psx2psp` CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "psx2psp"
path = "src/main.rs"

[build-dependencies]
miniz_oxide.workspace = true

[dependencies]
psx2psp-core.workspace = true
psx2psp-patching.workspace = true
psx2psp-media.workspace = true
psx2psp-recomp.workspace = true
psx2psp-sim.workspace = true
thiserror.workspace = true
miniz_oxide.workspace = true
rayon.workspace = true
# Self-update (update.rs): pure-Rust HTTPS (rustls + ring, Mozilla roots built in), no OpenSSL/curl.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile.workspace = true
