[package]
name = "psx2psp-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PSX2PSP-Reborn desktop GUI"

[[bin]]
name = "psx2psp-reborn"
path = "src/main.rs"

[dependencies]
psx2psp-engine = { path = "../psx2psp-engine" }
iced = { version = "0.14", features = ["wgpu", "image", "advanced", "svg"] }
rfd = "0.18"
cpal = "0.18"
bytemuck.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
pollster = "1"
tempfile.workspace = true
