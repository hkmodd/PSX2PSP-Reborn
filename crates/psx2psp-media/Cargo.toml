[package]
name = "psx2psp-media"
description = "Media pipeline: XMB image normalisation (in-process), SND0.AT3 via the native ATRAC3 encoder, FFmpeg/x264 for ICON1, yt-dlp fetch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
image.workspace = true
psx2psp-core.workspace = true
# Local audio → PCM for the native ATRAC3 encoder; what it cannot open (Opus, WebM…) goes to FFmpeg.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "alac", "flac", "vorbis", "pcm", "adpcm", "ogg", "wav", "aiff", "isomp4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
