# cargo-about: `cargo about generate --workspace --frozen about.hbs -o THIRD-PARTY-LICENSES.md`
# Notices of every crate compiled into the release binaries (dev/build-only crates excluded).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
