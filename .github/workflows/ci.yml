name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Clippy + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One runner per OS and CPU the releases ship for (release.yml).
        os: [windows-latest, windows-11-arm, ubuntu-latest, ubuntu-22.04-arm, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries (ALSA for the preview audio, X11/Wayland for winit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The GPU test of the XMB preview skips itself when the runner has no adapter.
      - name: Test
        run: cargo test --workspace --locked

  deny:
    name: Dependencies (advisories, licences, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Policy in deny.toml; fetches the RustSec advisory database on the runner.
      - uses: EmbarkStudios/cargo-deny-action@v2
